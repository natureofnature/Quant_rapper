[project]
name = "quant-contracts"
version = "0.1.0"
description = "Shared schemas: PIT panel, versioned graph, candidates, evaluation reports. No business logic."
requires-python = ">=3.12"
dependencies = [
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_contracts"]
