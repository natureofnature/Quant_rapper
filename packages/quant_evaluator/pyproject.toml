[project]
name = "quant-evaluator"
version = "0.1.0"
description = "Pure quantitative evaluation. No LLM, network, or UI dependencies."
requires-python = ">=3.12"
dependencies = [
    "quant-contracts",
]

[tool.uv.sources]
quant-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_evaluator"]
