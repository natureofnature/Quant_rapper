[project]
name = "quant-causal-graph"
version = "0.1.0"
description = "Hypothesis tree, dated relationship graph, evidence mapping, replay. Only package allowed to call an LLM."
requires-python = ">=3.12"
dependencies = [
    "quant-contracts",
    "quant-pit-data",
]

[tool.uv.sources]
quant-contracts = { workspace = true }
quant-pit-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_causal_graph"]
