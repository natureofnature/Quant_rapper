[project]
name = "quant-loop"
version = "0.1.0"
description = "Thin orchestration: historical ablation, post-market runs, maturity grading, feedback."
requires-python = ">=3.12"
dependencies = [
    "quant-contracts",
    "quant-pit-data",
    "quant-causal-graph",
    "quant-evaluator",
]

[tool.uv.sources]
quant-contracts = { workspace = true }
quant-pit-data = { workspace = true }
quant-causal-graph = { workspace = true }
quant-evaluator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_loop"]
